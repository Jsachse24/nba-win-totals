<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Win Totals 2026-27</title>
<meta name="description" content="Preseason NBA 2026-27 regular season win totals across DraftKings, FanDuel, BetMGM and Caesars.">
<style>
:root {
  --bg: #0f1216; --surface: #161b21; --surface-2: #1d232b; --border: #2a323c;
  --text: #e6e9ee; --muted: #8b95a3; --faint: #5d6774;
  --accent: #6aa9ff;
  --up: #3fbf7f; --down: #f0616d;
  --best-o: rgba(63, 191, 127, .18); --best-o-line: #3fbf7f;
  --best-u: rgba(106, 169, 255, .20); --best-u-line: #6aa9ff;
  --override: #e3b341;
  --pick: #c58af9; --pick-bg: rgba(197, 138, 249, .16);
  --row-hover: #1a2027;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
}
:root[data-theme="light"] {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #d9dee5;
  --text: #161a20; --muted: #5b6573; --faint: #8a94a2;
  --accent: #1f6fe0;
  --up: #16884f; --down: #c9303d;
  --best-o: rgba(22, 136, 79, .13); --best-o-line: #16884f;
  --best-u: rgba(31, 111, 224, .13); --best-u-line: #1f6fe0;
  --override: #a8730a;
  --pick: #8a3fd1; --pick-bg: rgba(138, 63, 209, .10);
  --row-hover: #f3f6fa;
  --shadow: 0 10px 40px rgba(20, 30, 50, .18);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1680px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
button, select, input, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
}
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--faint); }
input[type="search"] { min-width: 200px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.controls label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
button.tgl[aria-pressed="true"] { background: var(--pick-bg); border-color: var(--pick); color: var(--text); }
.banner {
  border: 1px solid var(--border); border-left: 3px solid var(--override);
  background: var(--surface); padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 12px;
}
.legend { color: var(--muted); font-size: 12px; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--faint); }
.na { color: var(--faint); }
.nop { color: var(--faint); opacity: .55; }
.ov { color: var(--override); font-size: 9px; vertical-align: super; margin-left: 1px; }
.alt { color: var(--override); font-size: 10px; font-weight: 600; margin-left: 3px; cursor: help; }
.tag { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; margin-left: 4px; white-space: nowrap; }
[data-pick] { cursor: pointer; }
[data-pick]:hover { outline: 1px dashed var(--pick); outline-offset: -2px; }
.mine { outline: 2px solid var(--pick) !important; outline-offset: -2px; background: var(--pick-bg) !important; }
.pickcell { color: var(--pick); font-weight: 600; }
.ev-pos { color: var(--up); font-weight: 600; }
.ev-neg { color: var(--muted); }

/* ---------- table ---------- */
.table-wrap {
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  overflow: auto; max-height: calc(100vh - 210px);
}
table { border-collapse: separate; border-spacing: 0; width: 100%; white-space: nowrap; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); }
thead th {
  position: sticky; z-index: 2; background: var(--surface-2); color: var(--muted);
  font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
}
thead tr:first-child th { top: 0; height: 26px; }
thead tr:nth-child(2) th { top: 26px; cursor: pointer; user-select: none; }
thead tr:nth-child(2) th:hover { color: var(--text); }
th.sorted { color: var(--text); }
th .arrow { font-size: 9px; margin-left: 3px; }
.grp { text-align: center; border-left: 1px solid var(--border); color: var(--text); }
.bl { border-left: 1px solid var(--border); }
td.team, th.team { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; box-shadow: 1px 0 0 var(--border); }
thead th.team { z-index: 3; background: var(--surface-2); }
td.team b { display: inline-block; min-width: 36px; }
td.team span { color: var(--muted); }
td.left, th.left { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--row-hover); }
tbody tr.sel td { background: var(--surface-2); }
tr.group td {
  background: var(--surface-2); color: var(--text); font-weight: 600; text-align: left;
  position: sticky; left: 0; font-size: 12px; cursor: default;
}
td.best-o { background: var(--best-o); }
td.best-u { background: var(--best-u); }
td.best-o.best-u { background: linear-gradient(90deg, var(--best-o) 50%, var(--best-u) 50%); }
td.tot.best-o { box-shadow: inset 2px 0 0 var(--best-o-line); }
td.tot.best-u { box-shadow: inset -2px 0 0 var(--best-u-line); }
td.tot.best-o.best-u { box-shadow: inset 2px 0 0 var(--best-o-line), inset -2px 0 0 var(--best-u-line); }
.mv { font-size: 10px; margin-left: 3px; }
td.cons { font-weight: 600; }
.bk { color: var(--muted); font-size: 11px; margin-left: 4px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* ---------- mobile cards ---------- */
#cards { display: none; }
.mobile-sort { display: none; }
@media (max-width: 767px) {
  .wrap { padding: 12px 16px; }
  .table-wrap { display: none; }
  #cards { display: block; }
  .mobile-sort { display: flex; }
  .view-seg { display: none; }
  input[type="search"] { min-width: 0; flex: 1 1 100%; }
  .controls > * { flex: 1 1 auto; }
}
.group-h { font-weight: 700; font-size: 13px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 10px; cursor: pointer;
}
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-h .nm { font-weight: 700; font-size: 14px; }
.card-h .nm span { color: var(--muted); font-weight: 400; }
.card-h .cd { color: var(--muted); font-size: 11px; white-space: nowrap; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; font-size: 12px; }
.stats .k { color: var(--muted); }
.card .bestrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.card .bestbox { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
.card .bestbox .k { color: var(--muted); font-size: 11px; display: block; }

/* ---------- drawer / bottom sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 20; display: none; }
.scrim.on { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 21;
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow);
  overflow-y: auto; padding: 14px 16px 24px; transform: translateX(105%); transition: transform .18s ease;
}
.drawer.on { transform: none; }
@media (max-width: 767px) {
  .drawer {
    top: auto; left: 0; width: 100%; max-height: 88vh; border-left: 0; border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0; transform: translateY(105%);
  }
  .drawer::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: -4px auto 10px; }
}
.dr-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.dr-h h2 { font-size: 17px; margin: 0; }
.dr-h h2 span { color: var(--muted); font-weight: 400; }
.dr-h .x { margin-left: auto; padding: 2px 9px; font-size: 16px; line-height: 1.2; }
.drawer h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.drawer table { font-size: 12px; }
.drawer th, .drawer td { padding: 4px 6px; }
.drawer thead th { position: static; }
.drawer td:first-child, .drawer th:first-child { text-align: left; }
.drawer tbody tr { cursor: default; }
.drawer .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.src-list { margin: 0; padding: 0 0 0 18px; font-size: 12px; }
.src-list li { margin: 4px 0; }
.src-list a, .drawer a { color: var(--accent); }

.note-ico { color: var(--accent); font-size: 13px; }
.drawer textarea { width: 100%; min-height: 90px; resize: vertical; font-size: 13px; }
.saved { color: var(--faint); font-size: 11px; }
#sanity b { color: var(--text); font-weight: 600; }
.slipdrawer { width: min(560px, 100vw); }
.sl-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.sl-bar input[type="text"] { flex: 1 1 140px; min-width: 0; }
.sl-bar input[type="number"] { width: 90px; }
.legs td input { width: 64px; padding: 2px 4px; text-align: right; }
table.legs { white-space: normal; }
@media (max-width: 767px) {
  .legs th, .legs td { padding: 4px 3px; font-size: 11px; }
  .legs td input { width: 46px; }
}
.legs .x { padding: 0 6px; }
.flag { border-left: 3px solid var(--override); background: var(--surface-2); padding: 5px 8px; margin: 4px 0; font-size: 12px; border-radius: 4px; }
.flag.light { border-left-color: var(--faint); }
.flag.bad { border-left-color: var(--down); }
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin: 8px 0; }
.summary div { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
.summary .k { display: block; color: var(--muted); font-size: 11px; }
.summary b { font-size: 14px; }
.addrow { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 12px; margin: 2px 0; }
.expo { font-size: 12px; }
.expo td, .expo th { padding: 3px 6px; }
footer { color: var(--faint); font-size: 11px; margin-top: 14px; line-height: 1.6; }
footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NBA Win Totals 2026-27</h1>
    <span class="meta" id="updated">Loading...</span>
    <span class="meta" id="sanity"></span>
    <span class="spacer"></span>
    <button id="theme" type="button" aria-label="Toggle light/dark mode">Light mode</button>
  </header>

  <div id="banners"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search team" aria-label="Search team">
    <label>Conf
      <select id="conf"><option value="">All</option><option>East</option><option>West</option></select>
    </label>
    <label>Div <select id="div"></select></label>
    <div class="seg" role="group" aria-label="Group by">
      <button type="button" data-group="flat" aria-pressed="true">Flat</button>
      <button type="button" data-group="conf" aria-pressed="false">Conference</button>
      <button type="button" data-group="div" aria-pressed="false">Division</button>
    </div>
    <div class="seg view-seg" role="group" aria-label="Columns">
      <button type="button" data-view="compact" aria-pressed="true">Compact</button>
      <button type="button" data-view="full" aria-pressed="false">Full view</button>
    </div>
    <button type="button" id="mine" class="tgl" aria-pressed="false">My picks only</button>
    <button type="button" id="export" title="Download your picks, notes and parlay slips as one JSON file">Export</button>
    <button type="button" id="import" title="Load a file made with Export (replaces this browser's picks, notes and slips)">Import</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <button type="button" id="slips-btn" class="tgl" aria-pressed="false">Parlay slips</button>
    <label class="mobile-sort">Sort
      <select id="msort"></select>
      <button type="button" id="mdir" aria-label="Toggle sort direction">&darr;</button>
    </label>
  </div>

  <div class="legend" id="legend"></div>

  <div class="table-wrap"><table id="tbl"></table></div>
  <div id="cards"></div>

  <footer id="footer"></footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" aria-hidden="true"></aside>
<aside class="drawer slipdrawer" id="slipdrawer" role="dialog" aria-modal="true" aria-labelledby="sl-title" aria-hidden="true"></aside>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------ settings
  // SIGMA: assumed SD (in wins) of a team's final wins around the market's
  // expectation. An assumption (typical miss of preseason totals), not fitted.
  var SIGMA = 8;
  // Rec column: expert average minus consensus line.
  var REC_THRESHOLD = 1.5;   // |gap| in wins needed for "Over"/"Under"; smaller = "No lean"
  var REC_MIN_SOURCES = 3;   // fewer independent expert sources than this = "Thin"

  // Canonical teams -- keep in sync with scraper/teams.py
  var TEAMS = [
    ["BOS","Boston","Celtics","East","Atlantic"],["BKN","Brooklyn","Nets","East","Atlantic"],
    ["NYK","New York","Knicks","East","Atlantic"],["PHI","Philadelphia","76ers","East","Atlantic"],
    ["TOR","Toronto","Raptors","East","Atlantic"],["CHI","Chicago","Bulls","East","Central"],
    ["CLE","Cleveland","Cavaliers","East","Central"],["DET","Detroit","Pistons","East","Central"],
    ["IND","Indiana","Pacers","East","Central"],["MIL","Milwaukee","Bucks","East","Central"],
    ["ATL","Atlanta","Hawks","East","Southeast"],["CHA","Charlotte","Hornets","East","Southeast"],
    ["MIA","Miami","Heat","East","Southeast"],["ORL","Orlando","Magic","East","Southeast"],
    ["WAS","Washington","Wizards","East","Southeast"],["DEN","Denver","Nuggets","West","Northwest"],
    ["MIN","Minnesota","Timberwolves","West","Northwest"],["OKC","Oklahoma City","Thunder","West","Northwest"],
    ["POR","Portland","Trail Blazers","West","Northwest"],["UTA","Utah","Jazz","West","Northwest"],
    ["GSW","Golden State","Warriors","West","Pacific"],["LAC","Los Angeles","Clippers","West","Pacific"],
    ["LAL","Los Angeles","Lakers","West","Pacific"],["PHX","Phoenix","Suns","West","Pacific"],
    ["SAC","Sacramento","Kings","West","Pacific"],["DAL","Dallas","Mavericks","West","Southwest"],
    ["HOU","Houston","Rockets","West","Southwest"],["MEM","Memphis","Grizzlies","West","Southwest"],
    ["NOP","New Orleans","Pelicans","West","Southwest"],["SAS","San Antonio","Spurs","West","Southwest"]
  ];
  var DIVS = { East: ["Atlantic", "Central", "Southeast"], West: ["Northwest", "Pacific", "Southwest"] };
  var DIV_ORDER = DIVS.East.concat(DIVS.West);
  var BOOKS = ["draftkings", "fanduel", "betmgm", "caesars"];
  var BOOK_NAME = { draftkings: "DraftKings", fanduel: "FanDuel", betmgm: "BetMGM", caesars: "Caesars" };
  var BOOK_SHORT = { draftkings: "DK", fanduel: "FD", betmgm: "MGM", caesars: "CZR" };
  var FIELDS = ["total", "over", "under"];
  var DASH = "-";

  // ---------------------------------------------------------------- utils
  function el(id) { return document.getElementById(id); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtTotal(v) { return isNum(v) ? v.toFixed(1) : DASH; }
  function fmtOdds(v) { return isNum(v) ? (v > 0 ? "+" + v : String(v)) : DASH; }
  function fmtPct(v) { return isNum(v) ? (v * 100).toFixed(1) + "%" : DASH; }
  function fmtSigned(v) {
    if (!isNum(v)) return DASH;
    if (v === 0) return "0.0";
    return (v > 0 ? "+" : "−") + Math.abs(v).toFixed(1);
  }
  function fmtEV(v) { return isNum(v) ? (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(1) + "%" : DASH; }
  function median(xs) {
    if (!xs.length) return null;
    var s = xs.slice().sort(function (a, b) { return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  // American odds -> implied probability (includes vig)
  function implied(a) {
    if (!isNum(a)) return null;
    return a < 0 ? -a / (-a + 100) : 100 / (a + 100);
  }
  // American odds -> profit per 1 unit staked
  function profit(a) { return a > 0 ? a / 100 : 100 / -a; }
  function fmtTime(iso) {
    if (!iso) return DASH;
    var d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function sideLetter(side) { return side === "over" ? "o" : "u"; }

  // ------------------------------------------------------------- storage
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* unavailable */ } }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // --------------------------------------------------------------- theme
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    el("theme").textContent = t === "dark" ? "Light mode" : "Dark mode";
  }
  setTheme(recall("nbawt-theme") === "light" ? "light" : "dark");
  el("theme").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    setTheme(next);
    store("nbawt-theme", next);
  });

  // ---------------------------------------------------- best-line model
  // Comparing o48.5 -200 with o50.5 -105 needs a view on how likely each
  // number is to land: final wins ~ Normal(mu, SIGMA), mu = market center.
  // Standard normal CDF (Abramowitz & Stegun 7.1.26 erf approximation)
  function phi(z) {
    var x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return z >= 0 ? (1 + y) / 2 : (1 - y) / 2;
  }
  // Win/push probabilities for a side at total T, with continuity correction.
  function sideProbs(side, T, mu) {
    var whole = Math.round(T) === T;
    var hi = whole ? T + 0.5 : T, lo = whole ? T - 0.5 : T;
    var pOver = 1 - phi((hi - mu) / SIGMA), pUnder = phi((lo - mu) / SIGMA);
    return { win: side === "over" ? pOver : pUnder, push: Math.max(0, 1 - pOver - pUnder) };
  }
  // mu such that P(over T) equals the given no-vig over probability (bisection)
  function solveMu(T, pOver) {
    var lo = T - 40, hi = T + 40;
    for (var i = 0; i < 60; i++) {
      var mid = (lo + hi) / 2;
      if (sideProbs("over", T, mid).win < pOver) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  // Expected profit per unit staked
  function evOf(side, T, price, mu) {
    var p = sideProbs(side, T, mu);
    return p.win * profit(price) - (1 - p.win - p.push);
  }
  // Market center: FanDuel's no-vig line when we have both FD prices (the only
  // book with both sides), otherwise the consensus median treated as a 50/50 line.
  function marketMu(row) {
    var fd = row.b.fanduel;
    if (isNum(fd.total) && fd.nvOver !== null) return { mu: solveMu(fd.total, fd.nvOver), basis: "FanDuel no-vig line" };
    if (row.cons !== null) return { mu: row.cons, basis: "consensus median (no two-sided price)" };
    return null;
  }

  // ---------------------------------------------------------- overrides
  // Mirrors scraper/core.py apply_overrides():
  //  - only keys present are applied; null clears a value
  //  - changing the total without a price for a side drops that side's scraped price
  function applyOverrides(books, ov, warn) {
    var merged = JSON.parse(JSON.stringify(books));
    var src = {};
    TEAMS.forEach(function (t) {
      src[t[0]] = {};
      BOOKS.forEach(function (b) {
        src[t[0]][b] = {};
        FIELDS.forEach(function (f) { src[t[0]][b][f] = isNum(merged[t[0]][b][f]) ? "scraped" : null; });
      });
    });
    var entries = (ov && Array.isArray(ov.overrides)) ? ov.overrides : [];
    entries.forEach(function (e, i) {
      if (!merged[e.team] || BOOKS.indexOf(e.book) < 0) {
        warn("Override #" + i + " skipped: unknown team/book (" + esc(e.team) + " / " + esc(e.book) + ")");
        return;
      }
      var bad = FIELDS.filter(function (f) {
        if (!(f in e) || e[f] === null) return false;
        return f === "total" ? !isNum(e[f]) : !(isNum(e[f]) && Math.round(e[f]) === e[f]);
      });
      if (bad.length) { warn("Override #" + i + " skipped: bad value for " + bad.join(", ")); return; }
      var rec = merged[e.team][e.book], s = src[e.team][e.book];
      if ("total" in e && e.total !== rec.total) {
        ["over", "under"].forEach(function (side) {
          if (!(side in e)) { rec[side] = null; s[side] = null; }
        });
      }
      FIELDS.forEach(function (f) {
        if (f in e) { rec[f] = e[f]; s[f] = e[f] === null ? null : "override"; }
      });
    });
    return { merged: merged, src: src };
  }

  // ---------------------------------------------------------------- rows
  function emptyBooks() {
    var o = {};
    TEAMS.forEach(function (t) {
      o[t[0]] = {};
      BOOKS.forEach(function (b) { o[t[0]][b] = { total: null, over: null, under: null }; });
    });
    return o;
  }
  function diff(cur, open) { return isNum(cur) && isNum(open) ? cur - open : null; }

  function buildRows(lines, ov, last, warn) {
    var scraped = emptyBooks();
    if (lines && lines.teams) {
      TEAMS.forEach(function (t) {
        BOOKS.forEach(function (b) {
          var r = lines.teams[t[0]] && lines.teams[t[0]][b];
          if (r) FIELDS.forEach(function (f) { scraped[t[0]][b][f] = isNum(r[f]) ? r[f] : null; });
        });
      });
    }
    var m = applyOverrides(scraped, ov, warn);
    var opening = (lines && lines.opening) || {};
    var suspect = {};
    ((lines && lines.suspect_alt_lines) || []).forEach(function (sp) { suspect[sp.team + "|" + sp.book] = sp; });
    var lastTeams = (last && last.teams) || {};

    return TEAMS.map(function (t) {
      var a = t[0];
      var row = {
        abbr: a, city: t[1], nickname: t[2], name: t[1] + " " + t[2], conf: t[3], div: t[4],
        lyW: lastTeams[a] && isNum(lastTeams[a].w) ? lastTeams[a].w : null,
        lyL: lastTeams[a] && isNum(lastTeams[a].l) ? lastTeams[a].l : null,
        pythW: lastTeams[a] && isNum(lastTeams[a].pw) ? lastTeams[a].pw : null,
        b: {}, an: [], anAll: [], anLatest: {}, anOver: 0, anUnder: 0, proj: null,
        experts: [], expertAvg: null
      };
      var totals = [], openTotals = [];
      BOOKS.forEach(function (b) {
        var cur = m.merged[a][b], op = (opening[a] && opening[a][b]) || null;
        var io = implied(cur.over), iu = implied(cur.under);
        var x = {
          total: cur.total, over: cur.over, under: cur.under, src: m.src[a][b], open: op,
          // Scraper dropped this book's line as a suspected alternate; ignored once an override supplies a total
          suspect: (!isNum(cur.total) && suspect[a + "|" + b]) || null,
          // No-vig: normalize the two implied probabilities to sum to 100%
          nvOver: (io !== null && iu !== null) ? io / (io + iu) : null,
          nvUnder: (io !== null && iu !== null) ? iu / (io + iu) : null,
          // Hold (overround): implied over + implied under - 100%
          hold: (io !== null && iu !== null) ? io + iu - 1 : null,
          mvTotal: op ? diff(cur.total, op.total) : null,
          // Price movement in implied probability, only when the total hasn't moved
          mvOver: (op && cur.total === op.total && implied(op.over) !== null && io !== null) ? io - implied(op.over) : null,
          mvUnder: (op && cur.total === op.total && implied(op.under) !== null && iu !== null) ? iu - implied(op.under) : null
        };
        row.b[b] = x;
        if (isNum(cur.total)) totals.push(cur.total);
        if (op && isNum(op.total)) openTotals.push(op.total);
      });
      row.luck = diff(row.lyW, row.pythW);
      row.nBooks = totals.length;
      row.cons = median(totals);
      row.consOpen = median(openTotals);
      row.consMove = diff(row.cons, row.consOpen);
      row.delta = diff(row.cons, row.lyW);

      row.mkt = marketMu(row);
      BOOKS.forEach(function (b) {
        var x = row.b[b];
        ["over", "under"].forEach(function (side) {
          x["ev" + side] = (row.mkt && isNum(x.total) && isNum(x[side])) ? evOf(side, x.total, x[side], row.mkt.mu) : null;
          x["pw" + side] = (row.mkt && isNum(x.total)) ? sideProbs(side, x.total, row.mkt.mu).win : null;
        });
      });
      row.bestOver = best(row, "over");
      row.bestUnder = best(row, "under");
      return row;
    });
  }

  // Best side = highest market EV among books with a total AND a price for that
  // side. Same total -> EV order is just price order. Books with no price for a
  // side can't be ranked and are left out (shown muted in the full view).
  function best(row, side) {
    var key = "ev" + side;
    var priced = BOOKS.filter(function (b) { return row.b[b][key] !== null; });
    if (!priced.length) return null;
    priced.sort(function (p, q) { return row.b[q][key] - row.b[p][key]; });
    var top = row.b[priced[0]];
    return {
      side: side, total: top.total, price: top[side], ev: top[key], pwin: top["pw" + side],
      books: priced.filter(function (b) { return row.b[b].total === top.total && row.b[b][side] === top[side]; })
    };
  }

  // Analyst picks: every record is listed in the drawer; the tally counts each
  // analyst once per team (their most recent pick by date).
  function attachAnalysts(rows, doc) {
    var by = {};
    rows.forEach(function (r) { by[r.abbr] = r; });
    ((doc && doc.picks) || []).forEach(function (p) {
      var r = by[p.team];
      // Dataset A: only explicitly stated sides count
      if (!r || (p.side !== "over" && p.side !== "under") || (p.basis && p.basis !== "stated")) return;
      r.anAll.push(p);
      var prev = r.anLatest[p.analyst];
      if (!prev || p.date > prev.date) r.anLatest[p.analyst] = p;
    });
    rows.forEach(function (r) {
      r.anAll.sort(function (x, y) { return x.analyst.localeCompare(y.analyst) || (y.date < x.date ? -1 : 1); });
      r.an = Object.keys(r.anLatest).map(function (k) { return r.anLatest[k]; });
      r.anOver = r.an.filter(function (p) { return p.side === "over"; }).length;
      r.anUnder = r.an.length - r.anOver;
    });
  }
  // Expert win numbers (dataset B): one number per expert per team (their latest);
  // the average and Rec use those. Sides are never derived from these.
  function attachExperts(rows, doc) {
    var by = {};
    rows.forEach(function (r) { by[r.abbr] = r; r.expAll = []; });
    ((doc && doc.wins) || []).forEach(function (w) {
      var r = by[w.team];
      if (r && isNum(w.wins)) r.expAll.push(w);
    });
    rows.forEach(function (r) {
      var latest = {};
      r.expAll.forEach(function (w) { if (!latest[w.expert] || w.date > latest[w.expert].date) latest[w.expert] = w; });
      r.experts = Object.keys(latest).sort().map(function (k) { return latest[k]; });
      r.expAll.sort(function (x, y) { return x.expert.localeCompare(y.expert) || (y.date < x.date ? -1 : 1); });
      r.expertAvg = r.experts.length ? r.experts.reduce(function (a, w) { return a + w.wins; }, 0) / r.experts.length : null;
      r.recGap = (r.expertAvg !== null && r.cons !== null) ? r.expertAvg - r.cons : null;
      r.rec = r.recGap === null ? null
        : r.experts.length < REC_MIN_SOURCES ? "thin"
        : r.recGap >= REC_THRESHOLD ? "over" : r.recGap <= -REC_THRESHOLD ? "under" : "none";
    });
  }
  function recCell(r) {
    if (r.rec === null) return val(DASH);
    var gap = fmtSigned(r.recGap);
    var t = "Expert avg " + r.expertAvg.toFixed(1) + " (" + r.experts.length + " source" + (r.experts.length === 1 ? "" : "s") +
      ") vs line " + fmtTotal(r.cons) + " = " + gap + ". Lean needs |gap| >= " + REC_THRESHOLD + " and " + REC_MIN_SOURCES + "+ sources.";
    var txt = r.rec === "thin" ? '<span class="na">Thin</span> <span class="bk">' + gap + "</span>"
      : r.rec === "none" ? '<span class="na">No lean</span>'
      : '<span class="' + (r.rec === "over" ? "up" : "down") + '">' + (r.rec === "over" ? "Over " : "Under ") + gap + "</span>";
    return '<span title="' + esc(t) + '">' + txt + "</span>";
  }

  function attachProjections(rows, doc) {
    var by = {};
    ((doc && doc.projections) || []).forEach(function (x) { if (isNum(x.projected_wins)) by[x.team] = x; });
    rows.forEach(function (r) { r.proj = by[r.abbr] || null; });
  }

  // ------------------------------------------------------------ my picks
  // { ABBR: { side, book, total, price, at } } -- the line/price as of tagging,
  // so a pick keeps the number you liked after a rescrape.
  var TEAM_SET = {};
  TEAMS.forEach(function (t) { TEAM_SET[t[0]] = true; });
  function cleanPicks(o) {
    var out = {};
    Object.keys(o || {}).forEach(function (k) {
      var p = o[k];
      if (TEAM_SET[k] && p && (p.side === "over" || p.side === "under") && BOOKS.indexOf(p.book) >= 0 && isNum(p.total)) {
        out[k] = { side: p.side, book: p.book, total: p.total, price: isNum(p.price) ? p.price : null, at: p.at || null };
      }
    });
    return out;
  }
  function loadJSONStore(key) {
    try { return JSON.parse(recall(key) || "null"); } catch (e) { return null; }
  }
  var PICKS = cleanPicks(loadJSONStore("nbawt-picks"));
  function savePicks() { store("nbawt-picks", JSON.stringify(PICKS)); }

  // Team notes: { ABBR: "free text" }
  var NOTE_MAX = 4000;
  function cleanNotes(o) {
    var out = {};
    Object.keys(o || {}).forEach(function (k) {
      if (TEAM_SET[k] && typeof o[k] === "string" && o[k].trim()) out[k] = o[k].slice(0, NOTE_MAX);
    });
    return out;
  }
  var NOTES = cleanNotes(loadJSONStore("nbawt-notes"));
  function saveNotes() { store("nbawt-notes", JSON.stringify(NOTES)); }

  // Parlay slips live under "nbawt-slips" (see slip builder); export/import carries them as-is.
  function loadSlipsRaw() { var s = loadJSONStore("nbawt-slips"); return Array.isArray(s) ? s : []; }

  // ---------------------------------------------------------- parlay slips
  // A slip: { id, name, book, stake, legs: [{ team, side, myProb }] }.
  // Parlays are placed at one book, so a leg stores only team + side; its line
  // and price always come from the slip's book (current scrape). myProb is your
  // optional override (0-1) and is saved with the slip.
  function cleanSlips(arr) {
    return (Array.isArray(arr) ? arr : []).map(function (sl, i) {
      var seen = {};
      return {
        id: typeof sl.id === "string" ? sl.id : "s" + Date.now().toString(36) + i,
        name: typeof sl.name === "string" && sl.name.trim() ? sl.name.slice(0, 60) : "Slip " + (i + 1),
        book: BOOKS.indexOf(sl.book) >= 0 ? sl.book : "fanduel",
        stake: isNum(sl.stake) && sl.stake > 0 ? sl.stake : null,
        legs: (Array.isArray(sl.legs) ? sl.legs : []).filter(function (l) {
          var okLeg = l && TEAM_SET[l.team] && (l.side === "over" || l.side === "under") && !seen[l.team];
          if (okLeg) seen[l.team] = true;
          return okLeg;
        }).map(function (l) {
          return { team: l.team, side: l.side, myProb: isNum(l.myProb) && l.myProb > 0 && l.myProb < 1 ? l.myProb : null };
        })
      };
    });
  }
  var SLIPS = cleanSlips(loadSlipsRaw());
  var activeSlip = SLIPS.length ? SLIPS[0].id : null;
  function saveSlips() { store("nbawt-slips", JSON.stringify(SLIPS)); }
  function onSlipsImported() { SLIPS = cleanSlips(loadSlipsRaw()); activeSlip = SLIPS.length ? SLIPS[0].id : null; }
  function slipById(id) { return SLIPS.filter(function (x) { return x.id === id; })[0] || null; }
  function newSlip() {
    var sl = { id: "s" + Date.now().toString(36), name: "Slip " + (SLIPS.length + 1), book: "fanduel", stake: null, legs: [] };
    SLIPS.push(sl); activeSlip = sl.id; saveSlips();
    return sl;
  }
  function decimalOdds(a) { return 1 + profit(a); }
  function toAmerican(dec) { return dec >= 2 ? Math.round((dec - 1) * 100) : Math.round(-100 / (dec - 1)); }
  // Evaluate a slip at its book. Legs without a line or price at that book are flagged
  // and make the combined numbers unavailable (never guessed).
  function evalSlip(sl) {
    var legs = sl.legs.map(function (l) {
      var r = ROW_BY[l.team], x = r.b[sl.book], price = x[l.side];
      var mkt = (r.mkt && isNum(x.total)) ? sideProbs(l.side, x.total, r.mkt.mu) : null;
      var prob = l.myProb !== null ? l.myProb : mkt ? mkt.win : null;
      var dec = isNum(price) ? decimalOdds(price) : null;
      return { leg: l, row: r, total: x.total, price: isNum(price) ? price : null, dec: dec,
               mktProb: mkt ? mkt.win : null, push: mkt ? mkt.push : 0, prob: prob,
               ev: (dec !== null && prob !== null) ? prob * dec - 1 : null,
               missing: !isNum(x.total) ? "no line" : !isNum(price) ? "no " + l.side + " price" : null };
    });
    var complete = legs.length > 0 && legs.every(function (g) { return !g.missing && g.prob !== null; });
    var dec = complete ? legs.reduce(function (a, g) { return a * g.dec; }, 1) : null;
    var prob = complete ? legs.reduce(function (a, g) { return a * g.prob; }, 1) : null;
    return { legs: legs, complete: complete, dec: dec, american: dec ? toAmerican(dec) : null,
             implied: dec ? 1 / dec : null, prob: prob, ev: dec ? prob * dec - 1 : null };
  }
  // Pairwise correlation flags between legs
  function corrFlags(sl) {
    var out = [];
    for (var i = 0; i < sl.legs.length; i++) {
      for (var j = i + 1; j < sl.legs.length; j++) {
        var a = sl.legs[i], b = sl.legs[j], ra = ROW_BY[a.team], rb = ROW_BY[b.team];
        var pair = a.team + " " + a.side + " + " + b.team + " " + b.side;
        if (ra.div === rb.div) {
          if (a.side === b.side) out.push({ cls: "", txt: pair + ": same division (" + ra.div + "), two " + a.side + "s. Slightly negatively " +
            "correlated: they play each other 4 times, and each of those games is a win for one and a loss for the other, " +
            "so the real chance both hit is a bit lower than the independence math shows." });
          else out.push({ cls: "bad", txt: pair + ": division rivals on opposite sides. This compounds the same thesis (their 4 head-to-head games " +
            "push both legs the same way). It's positively correlated, so the real chance both hit is higher than the independence " +
            "math shows. Some books restrict this combination for that reason." });
        } else if (ra.conf === rb.conf) {
          out.push({ cls: "light", txt: pair + ": same conference (" + ra.conf + "). Light correlation: they meet 3-4 times and compete for the same seeds." });
        }
      }
    }
    return out;
  }

  // -------------------------------------------------------------- cells
  function mvSpan(d, isPrice, title) {
    if (d === null || Math.abs(d) < 1e-9) return "";
    var up = d > 0;
    var txt = isPrice ? (up ? "▲" : "▼") : (up ? "▲" : "▼") + Math.abs(d).toFixed(1).replace(/\.0$/, "");
    return '<span class="mv ' + (up ? "up" : "down") + '" title="' + esc(title) + '">' + txt + "</span>";
  }
  function ovMark(s) { return s === "override" ? '<span class="ov" title="Manual override">&#9679;</span>' : ""; }
  function val(txt) { return txt === DASH ? '<span class="na">' + DASH + "</span>" : txt; }
  function signedCell(v) {
    if (!isNum(v)) return val(DASH);
    return '<span class="' + (v > 0 ? "up" : v < 0 ? "down" : "flat") + '">' + fmtSigned(v) + "</span>";
  }
  function consMoveCell(v) {
    if (!isNum(v)) return val(DASH);
    if (v === 0) return '<span class="flat">0.0</span>';
    return '<span class="' + (v > 0 ? "up" : "down") + '">' + (v > 0 ? "▲" : "▼") + Math.abs(v).toFixed(1) + "</span>";
  }
  function altMark(sp) {
    if (!sp) return "";
    var t = "VegasInsider showed o" + fmtTotal(sp.total) + " " + fmtOdds(sp.over) + ", " + fmtSigned(sp.total - sp.others_median) +
      " wins off the other books' median (" + fmtTotal(sp.others_median) + "). Excluded as a suspected alternate line. " +
      "Add the main line in manual_overrides.json.";
    return '<span class="alt" title="' + esc(t) + '">alt?</span>';
  }
  function modelTitle(r, x, side) {
    if (!r.mkt || !isNum(x.total)) return "";
    var t = "Market model: " + fmtPct(x["pw" + side]) + " to cash " + sideLetter(side) + fmtTotal(x.total);
    t += x["ev" + side] !== null ? ", Market EV " + fmtEV(x["ev" + side]) : ", no price published";
    return t + " (center " + r.mkt.mu.toFixed(1) + " from " + r.mkt.basis + ", SD " + SIGMA + "). Click to tag as my pick.";
  }
  // A price cell. Book has a line but no price for this side -> muted dash (see legend).
  function priceCell(r, b, side) {
    var x = r.b[b];
    var t = x.open ? "First tracked: " + sideLetter(side) + fmtTotal(x.open.total) + " " + fmtOdds(x.open[side]) : "";
    var inner = isNum(x[side]) ? fmtOdds(x[side]) : isNum(x.total) ? '<span class="nop">' + DASH + "</span>" : val(DASH);
    return '<span title="' + esc(modelTitle(r, x, side)) + '">' + inner + "</span>" +
      ovMark(x.src[side]) + mvSpan(side === "over" ? x.mvOver : x.mvUnder, true, t);
  }
  function pickAttrs(abbr, b, side, total) {
    if (!isNum(total)) return "";
    return ' data-pick="' + abbr + "|" + b + "|" + side + '" tabindex="0" role="button"';
  }
  function isMine(abbr, b, side) {
    var p = PICKS[abbr];
    return !!(p && p.book === b && p.side === side);
  }
  function bestCell(bst) {
    if (!bst) return val(DASH);
    return sideLetter(bst.side) + fmtTotal(bst.total) + " " + fmtOdds(bst.price) +
      '<span class="bk">' + bst.books.map(function (b) { return BOOK_SHORT[b]; }).join("/") + "</span>";
  }
  function evCell(bst) {
    if (!bst) return val(DASH);
    return '<span class="' + (bst.ev > 0 ? "ev-pos" : "ev-neg") + '" title="' + fmtPct(bst.pwin) + ' to cash">' +
      (bst.side === "over" ? "O " : "U ") + fmtEV(bst.ev) + "</span>";
  }
  function myPickCell(r) {
    var p = PICKS[r.abbr];
    if (!p) return val(DASH);
    var now = r.b[p.book].total;
    var h = '<span class="pickcell" title="Tagged ' + esc(fmtTime(p.at)) + " at " + sideLetter(p.side) +
      fmtTotal(p.total) + " " + fmtOdds(p.price) + '">' + (p.side === "over" ? "O " : "U ") + fmtTotal(p.total) + " " + BOOK_SHORT[p.book] + "</span>" +
      '<span class="bk">' + fmtOdds(p.price) + "</span>";
    if (now !== p.total) h += '<span class="tag" title="' + BOOK_NAME[p.book] + ' line has moved since you tagged it">now ' + fmtTotal(now) + "</span>";
    return h;
  }
  function analystCell(r) {
    if (!r.an.length) return "";
    var o = r.anOver, u = r.anUnder;
    return o > u ? "Over " + o + "-" + u : u > o ? "Under " + u + "-" + o : "Split " + o + "-" + u;
  }
  function projCell(r) {
    if (!r.proj) return val(DASH);
    var d = r.cons !== null ? r.proj.projected_wins - r.cons : null;
    return '<span title="' + esc(r.proj.system + " · " + r.proj.date) + '">' + r.proj.projected_wins.toFixed(1) + "</span>" +
      (d === null ? "" : " / " + signedCell(d));
  }
  function signedInt(v) {
    return '<span class="' + (v > 0 ? "up" : v < 0 ? "down" : "flat") + '">' + (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v) + "</span>";
  }
  function noteIcon(r) {
    var n = NOTES[r.abbr];
    if (!n) return "";
    return '<span class="note-ico" title="' + esc(n.length > 300 ? n.slice(0, 300) + "…" : n) + '" aria-label="Has note">&#9998;</span>';
  }
  function expertCell(r) {
    if (r.expertAvg === null) return val(DASH);
    return r.expertAvg.toFixed(1) + ' <span class="bk">(' + r.experts.length + ")</span>";
  }

  // ------------------------------------------------------------ columns
  // view: "both" = compact + full, "full" = full view only.
  // grp drives the top header row.
  function bookCols(b) {
    return [
      { key: b + ".total", label: "Tot", grp: b, view: "full", cls: "bl tot",
        get: function (r) { return r.b[b].total; },
        cell: function (r) {
          var x = r.b[b];
          var t = x.open ? "First tracked: " + fmtTotal(x.open.total) : "";
          return val(fmtTotal(x.total)) + ovMark(x.src.total) + mvSpan(x.mvTotal, false, t) + altMark(x.suspect);
        },
        tdcls: function (r) {
          var c = [];
          if (r.bestOver && r.bestOver.books.indexOf(b) >= 0) c.push("best-o");
          if (r.bestUnder && r.bestUnder.books.indexOf(b) >= 0) c.push("best-u");
          return c.join(" ");
        } },
      { key: b + ".over", label: "O", grp: b, view: "full",
        get: function (r) { return r.b[b].over; },
        cell: function (r) { return priceCell(r, b, "over"); },
        tdcls: function (r) {
          return (r.bestOver && r.bestOver.books.indexOf(b) >= 0 ? "best-o " : "") + (isMine(r.abbr, b, "over") ? "mine" : "");
        },
        attrs: function (r) { return pickAttrs(r.abbr, b, "over", r.b[b].total); } },
      { key: b + ".under", label: "U", grp: b, view: "full",
        get: function (r) { return r.b[b].under; },
        cell: function (r) { return priceCell(r, b, "under"); },
        tdcls: function (r) {
          return (r.bestUnder && r.bestUnder.books.indexOf(b) >= 0 ? "best-u " : "") + (isMine(r.abbr, b, "under") ? "mine" : "");
        },
        attrs: function (r) { return pickAttrs(r.abbr, b, "under", r.b[b].total); } },
      { key: b + ".nv", label: "NV O", grp: b, view: "full", title: BOOK_SHORT[b] + " no-vig over probability",
        get: function (r) { return r.b[b].nvOver; },
        cell: function (r) {
          var x = r.b[b];
          if (x.nvOver === null) return val(DASH);

  COLS = COLS.concat(bestCol("over"), bestCol("under"), [

      get: function (r) { return r.proj && r.cons !== null ? r.proj.projected_wins - r.cons : null; }, cell: projCell },

  var COL_BY_KEY = {};

  var GRP_LABEL = { cons: "Consensus", bestOver: "Best over", bestUnder: "Best under", ctx: "Experts", me: "Mine" };

  // ---------------------------------------------------------------- state

  var ROWS = [], ROW_BY = {};

  // -------------------------------------------------------------- sorting

    var col = COL_BY_KEY[state.sort] || COL_BY_KEY.cons;

      var a = col.get(p), b = col.get(q);
      var an = a === null || a === undefined, bn = b === null || b === undefined;
      if (an && bn) return p.name < q.name ? -1 : 1;
      if (an) return 1;   // missing always last
      if (bn) return -1;
      var c = typeof a === "string" ? a.localeCompare(b) : a - b;

      var label = state.group === "conf" ? k + "ern Conference" : (DIVS.East.indexOf(k) >= 0 ? "East · " : "West · ") + k;
      return { label: label, rows: sortRows(rs) };

  // ------------------------------------------------------------ rendering
  // Average hold per book over teams where it has both prices
  var BOOK_HOLD = {};
  function computeBookHolds() {
    BOOKS.forEach(function (b) {

      BOOK_HOLD[b] = hs.length ? { avg: hs.reduce(function (a, c) { return a + c; }, 0) / hs.length, n: hs.length } : null;
    });
  }
  function bookHoldLabel(b) {
    var h = BOOK_HOLD[b];
    return ' <span class="bk" title="' + (h ? "Average hold over " + h.n + " teams with both prices" : "No under prices, so hold can't be computed") + '">' +
      (h ? "hold " + fmtPct(h.avg) : "hold " + DASH) + "</span>";
  }

  function renderTable(groups, cols) {

      else spans.push({ g: g, n: 1 });
    });
    spans.forEach(function (sp, i) {

      h += lbl ? '<th class="grp" colspan="' + sp.n + '">' + lbl + "</th>"
               : '<th class="' + (i === 0 ? "team" : "") + '" colspan="' + sp.n + '"></th>';
    });
    h += "</tr><tr>";
    cols.forEach(function (c) {
      var sorted = state.sort === c.key;
      h += '<th data-key="' + c.key + '" class="' + (c.cls || "") + (sorted ? " sorted" : "") + '"' +
        (c.title ? ' title="' + esc(c.title) + '"' : "") +
        ' aria-sort="' + (sorted ? (state.dir > 0 ? "ascending" : "descending") : "none") + '">' +
        c.label + (sorted ? '<span class="arrow">' + (state.dir > 0 ? "▲" : "▼") + "</span>" : "") + "</th>";
    });

          h += "<td" + (cls ? ' class="' + cls + '"' : "") + (c.attrs ? c.attrs(r) : "") + ">" + c.cell(r) + "</td>";
        });
        h += "</tr>";
      });
    });
    if (!n) h += '<tr><td class="empty" colspan="' + cols.length + '">No teams match.</td></tr>';
    el("tbl").innerHTML = h + "</tbody>";

  function cardBest(r, bst, side) {

  function renderDrawer() {

      '<span><span class="k">25-26 </span>' + (r.lyW === null ? DASH : r.lyW + "-" + r.lyL) + "</span>" +

      esc(r.nickname) + ' (saved in this browser)">' + esc(NOTES[r.abbr] || "") + '</textarea><div class="saved" id="note-saved"></div>';

        }).join("") + '</select></label><label class="chk">Stake $<input type="number" id="sl-stake" min="0" step="1" value="' +
        (sl.stake === null ? "" : sl.stake) + '" placeholder="opt."></label></div>';

      if (!sl.legs.length) h += '<p class="note">No legs yet. Add from My Picks below, or open a team and use + Over / + Under.</p>';
      else {
        h += '<table class="legs"><thead><tr><th>Leg</th><th>Line</th><th>Price</th><th>Mkt prob</th><th>My prob %</th><th>Leg EV</th><th></th></tr></thead><tbody>';
        e.legs.forEach(function (g, i) {
          h += "<tr><td><b>" + g.leg.team + "</b> " + (g.leg.side === "over" ? "Over" : "Under") +
            (g.missing ? ' <span class="tag" style="color:var(--down)">' + BOOK_SHORT[sl.book] + " " + g.missing + "</span>" : "") + "</td>" +
            "<td>" + (isNum(g.total) ? sideLetter(g.leg.side) + fmtTotal(g.total) : val(DASH)) + "</td>" +
            "<td>" + val(fmtOdds(g.price)) + "</td>" +
            '<td title="Market model at this book\'s line (center from FanDuel no-vig, SD ' + SIGMA + ')">' + pct(g.mktProb) + "</td>" +
            '<td><input type="number" min="1" max="99" step="0.5" data-myprob="' + i + '" value="' +
            (g.leg.myProb === null ? "" : +(g.leg.myProb * 100).toFixed(1)) + '" placeholder="' + (g.mktProb === null ? "" : (g.mktProb * 100).toFixed(1)) + '" aria-label="My probability for ' + g.leg.team + '"></td>' +
            "<td>" + (g.ev === null ? val(DASH) : '<span class="' + (g.ev < 0 ? "down" : "up") + '">' + fmtEV(g.ev) + "</span>") + "</td>" +
            '<td><button type="button" class="x" data-rmleg="' + i + '" aria-label="Remove leg">&times;</button></td></tr>';
        });
        h += "</tbody></table>";
        var miss = e.legs.filter(function (g) { return g.missing; });
        if (miss.length) h += '<div class="flag bad">' + BOOK_NAME[sl.book] + " has no usable price for " +
          miss.map(function (g) { return g.leg.team + " " + g.leg.side + " (" + g.missing + ")"; }).join(", ") +
          ". Combined odds can't be computed until you switch book or remove those legs.</div>";
        var neg = e.legs.filter(function (g) { return g.ev !== null && g.ev < 0; });
        if (neg.length) h += '<div class="flag">Negative-EV leg' + (neg.length > 1 ? "s" : "") + ": " +
          neg.map(function (g) { return g.leg.team + " " + g.leg.side + " (" + fmtEV(g.ev) + ")"; }).join(", ") +
          ". Each one drags the parlay's EV down.</div>";
        var stake = sl.stake || 100;
        h += '<div class="summary">' +
          '<div><span class="k">Combined odds</span><b>' + (e.american === null ? DASH : fmtOdds(e.american)) + "</b></div>" +
          '<div><span class="k">Decimal</span><b>' + (e.dec === null ? DASH : e.dec.toFixed(2)) + "</b></div>" +
          '<div><span class="k">Payout per $100</span><b>' + (e.dec === null ? DASH : "$" + (100 * e.dec).toFixed(0)) + "</b>" +
            (e.dec === null ? "" : ' <span class="bk">profit $' + (100 * (e.dec - 1)).toFixed(0) + "</span>") + "</div>" +
          (sl.stake ? '<div><span class="k">Payout on $' + sl.stake + "</span><b>" + (e.dec === null ? DASH : "$" + (stake * e.dec).toFixed(2)) + "</b></div>" : "") +
          '<div><span class="k">Implied prob</span><b>' + pct(e.implied) + "</b></div>" +
          '<div><span class="k">Model prob</span><b>' + pct(e.prob) + "</b></div>" +
          '<div><span class="k">EV</span><b class="' + (e.ev === null ? "" : e.ev < 0 ? "down" : "up") + '">' + fmtEV(e.ev) + "</b></div></div>";
        h += '<p class="note">Model prob multiplies the legs (your % where entered, otherwise the market model), so it <b>assumes the legs are independent</b>. ' +
          "Win totals aren't fully independent; see flags below. Pushes on whole-number lines are treated as losses here.</p>";
        corrFlags(sl).forEach(function (f) { h += '<div class="flag ' + f.cls + '">' + esc(f.txt) + "</div>"; });
      }
      // add from my picks
      var avail = Object.keys(PICKS).filter(function (a) { return !sl.legs.some(function (l) { return l.team === a; }); });
      h += "<h3>Add from My Picks</h3>" + (avail.length
        ? avail.map(function (a) {
            var pk = PICKS[a];
            return '<label class="chk"><input type="checkbox" data-pickleg="' + a + '"> ' + a + " " + (pk.side === "over" ? "Over" : "Under") +
              ' <span class="bk">(your pick: ' + sideLetter(pk.side) + fmtTotal(pk.total) + " " + BOOK_SHORT[pk.book] + ")</span></label>";
          }).join("") + '<button type="button" data-addpicks>Add checked</button>'
        : '<p class="note">' + (Object.keys(PICKS).length ? "All your picks are already in this slip." : "No picks tagged yet.") + "</p>");
    }
    h += "<h3>Exposure (straight picks + all slips)</h3>" + exposureHtml();
    d.innerHTML = h;
  }
  function exposureHtml() {
    var items = Object.keys(PICKS).map(function (a) { return { team: a, side: PICKS[a].side, src: "pick" }; });
    SLIPS.forEach(function (sl) { sl.legs.forEach(function (l) { items.push({ team: l.team, side: l.side, src: sl.name }); }); });
    if (!items.length) return '<p class="note">Nothing yet.</p>';
    var over = items.filter(function (x) { return x.side === "over"; }).length;
    var byDiv = {}, byConf = {};
    items.forEach(function (x) {
      var r = ROW_BY[x.team];
      byDiv[r.div] = byDiv[r.div] || { o: 0, u: 0 }; byConf[r.conf] = byConf[r.conf] || { o: 0, u: 0 };
      byDiv[r.div][x.side === "over" ? "o" : "u"]++; byConf[r.conf][x.side === "over" ? "o" : "u"]++;
    });
    var multi = {};
    SLIPS.forEach(function (sl) { sl.legs.forEach(function (l) { (multi[l.team] = multi[l.team] || []).push(sl.name); }); });
    var multiTeams = Object.keys(multi).filter(function (t) { return multi[t].length > 1; });
    var stake = SLIPS.reduce(function (a, sl) { return a + (sl.stake || 0); }, 0);
    var h = '<div class="stats expo"><span><span class="k">Positions </span>' + items.length + " (" + Object.keys(PICKS).length + " straight, " +
      (items.length - Object.keys(PICKS).length) + " slip legs)</span>" +
      '<span><span class="k">Overs / Unders </span>' + over + " / " + (items.length - over) + "</span>" +
      '<span><span class="k">Total slip stake </span>' + (stake ? "$" + stake : DASH) + "</span></div>";
    h += '<table class="expo"><thead><tr><th>Group</th><th>Overs</th><th>Unders</th></tr></thead><tbody>';
    ["East", "West"].forEach(function (c) { if (byConf[c]) h += "<tr><td><b>" + c + "</b></td><td>" + byConf[c].o + "</td><td>" + byConf[c].u + "</td></tr>"; });
    DIV_ORDER.forEach(function (dv) { if (byDiv[dv]) h += "<tr><td>" + dv + "</td><td>" + byDiv[dv].o + "</td><td>" + byDiv[dv].u + "</td></tr>"; });
    h += "</tbody></table>";
    h += '<p class="note">' + (multiTeams.length ? "In more than one slip: " + multiTeams.map(function (t) {
      return "<b>" + t + "</b> (" + multi[t].map(esc).join(", ") + ")"; }).join("; ") : "No team appears in more than one slip.") + "</p>";
    return h;
  }
  function addLeg(team, side) {
    var sl = slipById(activeSlip) || newSlip();
    if (sl.legs.some(function (l) { return l.team === team; })) {
      alert(team + " is already in " + sl.name + ". One leg per team per slip.");
      return false;
    }
    sl.legs.push({ team: team, side: side, myProb: null });
    saveSlips();
    return true;
  }
  function openSlips() { state.drawer = null; state.slips = true; render(); var x = el("slipdrawer").querySelector("[data-close-slips]"); if (x) x.focus(); }
  function closeSlips() { state.slips = false; render(); }
  function renderMain() {
    var g = grouped(filtered());
    renderTable(g, visibleCols());
    renderCards(g);
    el("msort").value = state.sort;
    el("mdir").innerHTML = state.dir > 0 ? "&uarr;" : "&darr;";
    el("mine").setAttribute("aria-pressed", String(state.mine));
    var nP = Object.keys(PICKS).length;
    el("mine").textContent = "My picks only" + (nP ? " (" + nP + ")" : "");
    Array.prototype.forEach.call(document.querySelectorAll("[data-group]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-group") === state.group));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === state.view));
    });
  }

  // ------------------------------------------------------------- controls
  function fillDivs() {
    var opts = state.conf ? DIVS[state.conf] : DIV_ORDER;
    if (state.div && opts.indexOf(state.div) < 0) state.div = "";
    el("div").innerHTML = '<option value="">All</option>' + opts.map(function (d) {
      return "<option" + (d === state.div ? " selected" : "") + ">" + d + "</option>";
    }).join("");
  }
  function setSort(key) {
    if (state.sort === key) state.dir = -state.dir;
    else { state.sort = key; state.dir = key === "team" || key === "div" ? 1 : -1; }
    persist();
    render();
  }
  function togglePick(a, b, side) {
    var r = ROW_BY[a];
    if (!r || !isNum(r.b[b].total)) return;
    var cur = PICKS[a];
    if (cur && cur.book === b && cur.side === side) delete PICKS[a];
    else PICKS[a] = { side: side, book: b, total: r.b[b].total, price: isNum(r.b[b][side]) ? r.b[b][side] : null, at: new Date().toISOString() };
    savePicks();
    render();
  }
  function activate(e) {
    var th = e.target.closest("th[data-key]");
    if (th) { setSort(th.getAttribute("data-key")); return true; }
    if (e.target.closest("a, input, textarea, select")) return false;
    var pk = e.target.closest("[data-pick]");
    if (pk) { var p = pk.getAttribute("data-pick").split("|"); togglePick(p[0], p[1], p[2]); return true; }
    if (e.target.closest("[data-close]")) { closeDrawer(); return true; }
    var al = e.target.closest("[data-addleg]");
    if (al) { var q = al.getAttribute("data-addleg").split("|"); if (addLeg(q[0], q[1])) render(); return true; }
    if (e.target.closest("[data-open-slips]")) { openSlips(); return true; }
    var un = e.target.closest("[data-unpick]");
    if (un) { delete PICKS[un.getAttribute("data-unpick")]; savePicks(); render(); return true; }
    var t = e.target.closest("[data-team]");
    if (t) { openDrawer(t.getAttribute("data-team")); return true; }
    return false;
  }
  ["tbl", "cards", "drawer"].forEach(function (id) {
    el(id).addEventListener("click", activate);
    el(id).addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-pick], [data-team], button") && activate(e)) e.preventDefault();
    });
  });
  el("scrim").addEventListener("click", function () { if (state.slips) closeSlips(); else closeDrawer(); });
  el("slips-btn").addEventListener("click", function () { if (state.slips) closeSlips(); else openSlips(); });
  var sd = el("slipdrawer");
  sd.addEventListener("click", function (e) {
    var t = e.target;
    if (t.closest("[data-close-slips]")) { closeSlips(); return; }
    if (t.closest("[data-newslip]")) { newSlip(); render(); return; }
    if (t.closest("[data-delslip]")) {
      var sl = slipById(activeSlip);
      if (sl && confirm("Delete " + sl.name + "?")) {
        SLIPS = SLIPS.filter(function (x) { return x !== sl; }); activeSlip = SLIPS.length ? SLIPS[0].id : null; saveSlips(); render();
      }
      return;
    }
    var rm = t.closest("[data-rmleg]");
    if (rm) { slipById(activeSlip).legs.splice(+rm.getAttribute("data-rmleg"), 1); saveSlips(); render(); return; }
    if (t.closest("[data-addpicks]")) {
      Array.prototype.forEach.call(sd.querySelectorAll("[data-pickleg]:checked"), function (c) {
        var a = c.getAttribute("data-pickleg"); addLeg(a, PICKS[a].side);
      });
      render();
    }
  });
  sd.addEventListener("change", function (e) {
    var t = e.target, sl = slipById(activeSlip);
    if (t.id === "sl-pick") { activeSlip = t.value; render(); return; }
    if (!sl) return;
    if (t.id === "sl-name") { sl.name = t.value.trim().slice(0, 60) || sl.name; }
    else if (t.id === "sl-book") { sl.book = t.value; }
    else if (t.id === "sl-stake") { var v = parseFloat(t.value); sl.stake = isNum(v) && v > 0 ? v : null; }
    else if (t.hasAttribute("data-myprob")) {
      var leg = sl.legs[+t.getAttribute("data-myprob")], v2 = parseFloat(t.value);
      leg.myProb = isNum(v2) && v2 > 0 && v2 < 100 ? v2 / 100 : null;
    } else return;
    saveSlips();
    render();
  });
  var noteTimer = null;
  el("drawer").addEventListener("input", function (e) {
    var a = e.target.getAttribute && e.target.getAttribute("data-note");
    if (!a) return;
    var v = e.target.value;
    if (v.trim()) NOTES[a] = v.slice(0, NOTE_MAX); else delete NOTES[a];
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      saveNotes();
      var s = el("note-saved");
      if (s) s.textContent = "Saved " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      renderMain();
    }, 400);
  });

  // ------------------------------------------------------ export / import
  // One JSON file with picks, notes and parlay slips, to move state between devices.
  var EXPORT_APP = "nba-win-totals-2026-27";
  el("export").addEventListener("click", function () {
    var doc = { app: EXPORT_APP, version: 1, exported_at: new Date().toISOString(),
                picks: PICKS, notes: NOTES, slips: loadSlipsRaw() };
    var blob = new Blob([JSON.stringify(doc, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "nba-win-totals-my-data-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  el("import").addEventListener("click", function () { el("import-file").click(); });
  el("import-file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var doc;
      try { doc = JSON.parse(rd.result); } catch (err) { alert("That file isn't valid JSON."); return; }
      if (!doc || doc.app !== EXPORT_APP) { alert("That file wasn't made with this page's Export button."); return; }
      var picks = cleanPicks(doc.picks), notes = cleanNotes(doc.notes), slips = Array.isArray(doc.slips) ? doc.slips : [];
      var msg = "Replace this browser's data with the file?\n\nFile: " + Object.keys(picks).length + " picks, " +
        Object.keys(notes).length + " notes, " + slips.length + " slips\nHere now: " + Object.keys(PICKS).length + " picks, " +
        Object.keys(NOTES).length + " notes, " + loadSlipsRaw().length + " slips";
      if (!confirm(msg)) return;
      PICKS = picks; NOTES = notes;
      savePicks(); saveNotes(); store("nbawt-slips", JSON.stringify(slips));
      if (typeof onSlipsImported === "function") onSlipsImported();
      render();
    };
    rd.readAsText(f);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (state.slips) closeSlips(); else if (state.drawer) closeDrawer();
  });

  el("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  el("conf").addEventListener("change", function (e) { state.conf = e.target.value; fillDivs(); render(); });
  el("div").addEventListener("change", function (e) { state.div = e.target.value; render(); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-group]"), function (b) {
    b.addEventListener("click", function () { state.group = b.getAttribute("data-group"); persist(); render(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (b) {
    b.addEventListener("click", function () {
      state.view = b.getAttribute("data-view");
      if (COL_BY_KEY[state.sort].view === "full" && state.view !== "full") state.sort = "cons";
      persist(); render();
    });
  });
  el("mine").addEventListener("click", function () { state.mine = !state.mine; persist(); render(); });
  // Mobile sort: cards follow the compact view, so offer compact columns
  el("msort").innerHTML = COLS.filter(function (c) { return c.view === "both"; }).map(function (c) {
    return '<option value="' + c.key + '">' + esc(sortLabel(c)) + "</option>";
  }).join("");
  el("msort").addEventListener("change", function (e) { state.sort = e.target.value; persist(); render(); });
  el("mdir").addEventListener("click", function () { state.dir = -state.dir; persist(); render(); });
  window.matchMedia("(max-width: 767px)").addEventListener("change", function () { render(); });

  // ----------------------------------------------------------------- load
  function getJSON(path) {
    return fetch(path, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(path + ": HTTP " + r.status);
      return r.json();
    }).catch(function (e) { return { _err: e }; });
  }
  function ok(x) { return x && !x._err ? x : null; }

  var banners = [];
  function warn(msg) { banners.push(msg); }

  Promise.all([
    getJSON("data/lines.json"), getJSON("data/manual_overrides.json"), getJSON("data/last_season.json"),
    getJSON("data/analyst_picks.json"), getJSON("data/projections.json"), getJSON("data/expert_wins.json")
  ]).then(function (res) {
    var lines = ok(res[0]), ov = ok(res[1]), last = ok(res[2]), anDoc = ok(res[3]), projDoc = ok(res[4]), expDoc = ok(res[5]);

    if (location.protocol === "file:") {
      warn("Opened from disk, so the browser blocks loading the data files. Run <code>python -m http.server</code> in this folder and open http://localhost:8000.");
    } else {
      if (!lines) warn("Scraped lines unavailable (" + esc(res[0]._err.message) + "). Showing manual overrides only.");
      if (!last) warn("2025-26 records unavailable (" + esc(res[2]._err.message) + ").");
    }
    if (lines && lines.sources) {
      Object.keys(lines.sources).forEach(function (k) {
        var s = lines.sources[k];
        if (!s.ok) warn("Source <b>" + esc(k) + "</b> failed on the last run: " + esc(s.error || "") + ". Its books show " + DASH + " unless overridden.");
      });
    }

    ROWS = buildRows(lines, ov, last, warn);
    ROWS.forEach(function (r) { ROW_BY[r.abbr] = r; });
    attachAnalysts(ROWS, anDoc);
    attachProjections(ROWS, projDoc);
    attachExperts(ROWS, expDoc);
    computeBookHolds();
    // Header sanity check: the 30 lines should roughly add up to the 1230 wins that exist
    var consAll = ROWS.map(function (r) { return r.cons; }).filter(isNum);
    if (consAll.length) {
      var sum = consAll.reduce(function (a, c) { return a + c; }, 0), d = sum - 1230;
      el("sanity").innerHTML = "· Sum of lines <b>" + sum.toFixed(1) + "</b> vs 1230 (" + fmtSigned(d) + ")" +
        (consAll.length < 30 ? " · only " + consAll.length + "/30 teams have a line" : "") + " · " +
        (Math.abs(d) < 0.05 ? "matches the wins that exist" : d > 0
          ? "market implies more wins than exist, which favors unders collectively"
          : "market implies fewer wins than exist, which favors overs collectively");
    }
    var sus = [];
    ROWS.forEach(function (r) { BOOKS.forEach(function (b) { if (r.b[b].suspect) sus.push(r.abbr + " " + BOOK_SHORT[b]); }); });
    if (sus.length) warn("Excluded as suspected alternate lines (2+ wins off the other books): <b>" + sus.join(", ") +
      "</b>. VegasInsider doesn't mark main vs alt lines, so these show " + DASH + ". Add the main line in manual_overrides.json.");
    var nOv = ov && Array.isArray(ov.overrides) ? ov.overrides.length : 0;

    var basis = lines && lines.opening_basis === "open" ? "since open" : "since first tracked";
    var first = lines && lines.first_tracked_at;
    el("updated").innerHTML = lines
      ? "Last updated " + fmtTime(lines.generated_at) + " · Movement " + basis + (first && basis !== "since open" ? " (" + fmtDate(first) + ")" : "")
      : "Last updated " + DASH;

    el("legend").innerHTML =
      '<span><span class="swatch" style="background:var(--best-o);box-shadow:inset 2px 0 0 var(--best-o-line)"></span>Best over / ' +
      '<span class="swatch" style="background:var(--best-u);box-shadow:inset -2px 0 0 var(--best-u-line)"></span>best under (Market EV)</span>' +
      '<span><span class="nop">' + DASH + "</span> faded dash = book has a line but doesn't publish that price (VegasInsider shows overs only), so it can't be ranked</span>" +
      '<span><span class="swatch" style="outline:2px solid var(--pick);outline-offset:-2px;background:var(--pick-bg)"></span>My pick: tap a best line or any book price</span>' +
      "<span>Click a team for details</span>" +
      (nOv ? '<span><span class="ov" style="vertical-align:0">&#9679;</span> Manual override (' + nOv + ")</span>" : "");

    var srcBits = [];
    if (lines && lines.book_source && lines.sources) {
      BOOKS.forEach(function (b) {
        var sk = lines.book_source[b], s = lines.sources[sk];
        srcBits.push(BOOK_NAME[b] + ": " + (s ? '<a href="' + esc(s.url) + '" rel="noopener">' + esc(sk === "fanduel" ? "FanDuel" : "VegasInsider") + "</a>" : esc(sk)));
      });
    }
    el("footer").innerHTML =
      "<b>Market EV</b> prices each offer against the market's own center: FanDuel's no-vig line (the only book where we have both sides), " +
      "with final wins assumed normal around it (SD " + SIGMA + " wins, an assumption). It measures <i>line-shopping value</i> — " +
      "how much better one book's number/price is than the market — not a forecast of the team. Near-zero or negative is normal; " +
      "it only goes positive when a book is out of line with FanDuel.<br>" +
      "Preseason lines only. Data: " + (srcBits.join(" · ") || DASH) + ". " +
      "2025-26 records: " + (last && last.source ? '<a href="' + esc(last.source) + '" rel="noopener">Basketball-Reference</a>' : DASH) + ". " +
      "Analyst picks (stated sides only): " + (anDoc && anDoc.picks ? anDoc.picks.length : DASH) + ". " +
      "Expert win numbers: " + (expDoc && expDoc.wins ? expDoc.wins.length : DASH) + ". " +
      "<b>Rec</b> = expert average minus the consensus line: Over/Under at " + REC_THRESHOLD + "+ wins, No lean below that, Thin with fewer than " +
      REC_MIN_SOURCES + " independent sources. " +
      "Projections: " + (projDoc && projDoc.projections && projDoc.projections.length ? esc(projDoc.system || "") : "not published yet") + ".";

    el("banners").innerHTML = banners.map(function (b) { return '<div class="banner">' + b + "</div>"; }).join("");
    fillDivs();
    render();
  });
})();
</script>
</body>
</html>
